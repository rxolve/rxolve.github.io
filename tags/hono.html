ory and fed them through the existing pipeline. Smiley, skull, ghost, alien, angry face, thumbs up, fire, lightning, poop, theater masks. I also reworked the conversion tool so it could accept new additions. The image repository closed its door on me twice, but waiting a moment was all it took for it to open again.\n\nWhen I set the hand-drawn pieces aside and placed the converted results next to them, the difference was clear. The ghost's wavy bottom, the skull's crossbones, the curves of the flame — things you simply cannot achieve by placing characters by hand. Sometimes it is better to trust the tools.\n\n```ascii\n              .:=+*#%%%@%%%##+=:.\n           :=*%@@@@@@@@@@@@@@@@@%#+:\n        .=#@@@@@@@@@@@@@@@@@@@@@@@@@%+:\n      .+%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@*:\n     =%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@*.\n   .*@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%-\n  .#@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%-\n .#@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%:\n *@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@#\n:@@@@@@@@@@@@@%%%@@@@@@@@@@@@@%%%@@@@@@@@@@@@@=\n*@@@@@@@@@@@#-.  :+%@@@@@@@%+:  .-#@@@@@@@@@@@#\n%@@@@@@@@@@#       +@@@@@@@+       #@@@@@@@@@@%\n@@@@@@@@@@@#       +@@@@@@@+       #@@@@@@@@@@@\n@@@@@@@@@@@@#-. .:+%@@@@@@@%+:. .-#@@@@@@@@@@@@\n@@@@@@@@@@@@@@%%%@@@@@@@@@@@@@%%%@@@@@@@@@@@@@@\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n@@@@@#=-=#@@@@@@@@@@@%+=+%@@@@@@@@@@@#=-=#@@@@@\n+#
