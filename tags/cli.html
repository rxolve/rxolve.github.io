 검은 외곽선을 두르고, 열쇠는 색을 둘에서 다섯으로 늘렸다. 활의 곡선을 조이고 시위를 보이게 했다. 엘프는 좀 더 가늘게, 스켈레톤은 갈비뼈가 드러나게 체형을 갈랐다. 팔레트에서 쓰이지 않던 다크퍼플과 라벤더가 물약의 그림자와 치유 이펙트 속에서 제 자리를 찾아갔다. 열여섯 가지 색이란 결국 열여섯 개의 단어 같은 것이어서, 하나도 낭비하고 싶지 않았다.\n\n마지막으로 import와 export CLI를 붙였다. 숫자로만 이루어진 격자를 들여다보며 스프라이트를 편집하는 건, 악보만 읽고 음악을 고치려는 것과 다르지 않았다. 이제 스프라이트를 PNG로 내보내서 그림 도구에서 눈으로 보며 편집하고, 다시 임포트하면 팔레트 양자화를 거쳐 JSON으로 돌아온다. 칼 하나를 내보내고 다시 들여온 뒤 원본과 비교했다. 픽셀이 정확히 일치했다. 번역을 거쳐 돌아온 문장이 한 글자도 빠지지 않은 느낌이었다. 37개 테스트가 통과하고, 빌드가 깨끗했다. 첫째 날치고는 꽤 멀리까지 걸어왔다.\n\n\u0026nbsp;\n\n---\n\n\u0026nbsp;\n\nCS 자동화 봇에 기억을 심었다. 이전까지 봇은 매번 같은 유형의 문의를 처음 보는 것처럼 처리했다. 환불 가능 여부를 판단하고, 정책을 확인하고, 이메일을 쓰는 과정을 처음부터 되풀이했다. 사람이라면 세 번째쯤에는 손이 먼저 움직일 텐데, 이 봇에게는 어제라는 게 없었다.\n\nSQLite의 FTS5를 골랐다. 벡터 데이터베이스를 붙이면 의미 검색이 되겠지만, CS 문의라는 영역은 생각보다 어휘가 좁다. 환불은 환불이고 해지는 해지다. 같은 단어가 반복되는 세계에서는 키워드 검색과 BM25 랭킹이면 충분하다. 별도 서버도, 임베딩 API 호출도 필요 없이 이미 쓰고 있는 세션 데이터베이스 파일 하나에 테이블 두 개를 얹었다.\n\n흐름은 단순하다. 담당자가 승인 버튼을 누르고 모든 작업이 성공하면, 봇이 남겨둔 맥락 요약에서 문의 내용과 처리 결과를 뽑아 저장한다. 다음에 비슷한 문의가 들어오면, 저장된 사례 중 가장 가까운 세 건을 찾아 시스템 프롬프트에 끼워 넣는다. 봇은 그것을 참고하되 강제받지는 않는다. 경험이라기보다는 메모에 가깝다. 일 년이 지나면 자동으로 지워진다. 기억도 유통기한이 있는 편이 건강하다."])</script><script>self.__next_f.push([1,"17:Tce0,"])</script><script>self.__next_f.push([1,"I started a project called pixscii. An MCP server that lets AI agents work with pixel art. A 16x16 grid feels like a small room, but once you stand a sword upright in it, you find there's more space than you expected. I built seven tools covering search, rendering, character generation, animation, composition, tilemaps, and image conversion, and drew 22 sprites using the sixteen colors of the PICO-8 palette. Swords, shields, potions. Grass, stone, water. Hearts, cursors. The minimum needed to form a small world.\n\nI added a character system too. Four species combined with armor, weapons, and helms, so that a single seed string gives birth to one of 648 distinct figures. I liked that calling the same name always brings back the same face. I had initially written 864, but helms turned out to be three types. There was also a bug where skeleton bones were being painted in skin tones. Putting skin on bones was, in any case, getting the order wrong.\n\nRefining sprite quality was like planting a single blade of grass on a tile. There's no end to it. I outlined six items and three UI elements in black, expanded the key from two colors to five. Tightened the bow's curve and made the string visible. Made elves slimmer, gave skeletons visible ribs. Dark-purple and lavender, colors that had sat unused in the palette, found their places in potion shadows and healing effects. Sixteen colors are, in the end, like sixteen words — I didn't want to waste a single one.\n\nFinally I added import and export to the CLI. Editing sprites by staring at grids of numbers was no different from trying to fix music by reading only the score. Now you can export a sprite as a PNG, edit it visually in a drawing tool, and import it back through palette quantization into JSON. I exported a sword, brought it back in, and compared it to the original. The pixels matched exactly. It felt like a sentence that had been translated and returned without losing a single letter. Thirty-seven tests passed, the build was clean. For a first day, we walked quite far.\n\n\u0026nbsp;\n\n---\n\n\u0026nbsp;\n\nI planted memory in the CS automation bot. Until now, it handled every inquiry of the same type as if seeing it for the first time. Checking refund eligibility, reviewing policy, composing the email — repeating the whole process from scratch. A person would have their hands moving ahead by the third time, but this bot had no yesterday.\n\nI chose SQLite's FTS5. A vector database would enable semantic search, but the domain of CS inquiries has a narrower vocabulary than you might think. A refund is a refund, a cancellation is a cancellation. In a world where the same words recur, keyword search with BM25 ranking is enough. No separate server, no embedding API calls — I just added two tables to the session database file already in use.\n\nThe flow is simple. When a team member presses the approve button and all actions succeed, the bot extracts the inquiry summary and resolution from its context summary and saves them. When a similar inquiry arrives next, it finds the three closest cases and slips them into the system prompt. The bot references them but isn't bound by them. It's closer to notes than experience. After a year, they're automatically deleted. Memory, too, is healthier with an expiration date."])</script><script>self.__next_f.push([1,"9:[\"$\",\"section\",null,{\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/tags\",\"className\":\"mb-4 inline-block font-sans text-sm transition-colors hover:opacity-70\",\"style\":{\"color\":\"var(--color-muted)\"},\"children\":\"← 모든 태그\"}],[\"$\",\"h1\",null,{\"className\":\"mb-8 text-3xl font-semibold tracking-tight\",\"style\":{\"color\":\"var(--color-ink)\"},\"children\":[\"#\",\"cli\"]}],[\"$\",\"div\",null,{\"className\":\"divide-y\",\"style\":{\"borderColor\":\"var(--color-muted)\"},\"children\":[[\"$\",\"$L15\",\"2026-04-10\",{\"entry\":{\"title\":\"16x16 격자 위의 첫 번째 날\",\"date\":\"2026-04-10\",\"style\":\"murakami\",\"tags\":[\"pixel-art\",\"mcp\",\"cli\",\"tooling\",\"sqlite\",\"fts5\",\"long-term-memory\"],\"project\":\"pixscii, longblack-csbot\",\"slug\":\"2026-04-10\",\"content\":{\"ko\":\"$16\",\"en\":\"$17\"}}}]]}]]}]\n"])</script></body></html>
