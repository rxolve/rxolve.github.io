ally detected. The score climbed from twenty-five to sixty-seven, and time would take care of the rest.\n\nIn the evening I thought about where this tool goes next. Text posts and links are already saturated. It would be better to show something alive and moving in a terminal. The word animation stayed in my mind. No concrete shape yet, but the direction was set."])</script><script>self.__next_f.push([1,"9:[\"$\",\"section\",null,{\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/tags\",\"className\":\"mb-4 inline-block font-sans text-sm transition-colors hover:opacity-70\",\"style\":{\"color\":\"var(--color-muted)\"},\"children\":\"← 모든 태그\"}],[\"$\",\"h1\",null,{\"className\":\"mb-8 text-3xl font-semibold tracking-tight\",\"style\":{\"color\":\"var(--color-ink)\"},\"children\":[\"#\",\"registry\"]}],[\"$\",\"div\",null,{\"className\":\"divide-y\",\"style\":{\"borderColor\":\"var(--color-muted)\"},\"children\":[[\"$\",\"$L15\",\"2026-04-05\",{\"entry\":{\"title\":\"100이라는 숫자가 갖는 무게\",\"titleEn\":\"The Weight of a Hundred\",\"date\":\"2026-04-05\",\"style\":\"murakami\",\"tags\":[\"mcp\",\"ascii-art\",\"registry\",\"figlet\"],\"project\":\"artscii\",\"slug\":\"2026-04-05\",\"content\":{\"ko\":\"어제 공식 무대에 이름을 올린 도구에 오늘은 살을 붙이는 시간이었다.\\n\\n먼저 텍스트를 큰 글자로 바꿔주는 기능을 넣었다. 세상에는 삼백 개가 넘는 글꼴이 있지만, 에이전트에게 삼백 개의 선택지를 주면 오히려 아무것도 고르지 못한다. 다섯 개만 골랐다. 기본형, 작은형, 기울임, 굵은형, 극소형. 그것으로 충분했다.\\n\\n그 다음은 양을 채우는 일이었다. 자유롭게 쓸 수 있는 실루엣 아이콘들을 하나씩 내려받아 변환했다. 나비, 펭귄, 늑대, 토성, 마법사, 모루, 닻. 서른여덟 개를 더하니 아트가 백 개를 넘겼다. 카오모지도 열 개를 추가해서 정확히 백에 맞췄다. 백이라는 숫자에 특별한 의미가 있는 건 아니지만, 두 자리와 세 자리 사이에는 보이지 않는 문턱이 있다.\\n\\n오후에는 이 도구를 사람들이 찾을 수 있는 곳에 놓는 작업을 했다. 큐레이션 목록에 등록을 시도했지만, 품질 점수를 먼저 받아야 한다는 답이 돌아왔다. 소유권을 인증하고, 빌드를 통과시키고, 도구 목록이 자동으로 감지되게 만들었다. 점수는 스물다섯에서 예순일곱까지 올라갔고, 나머지는 시간이 채워줄 것이다.\\n\\n저녁에는 이 도구의 다음 행보를 생각했다. 글과 링크로 알리는 방식은 이미 포화 상태다. 터미널에서 무언가가 살아 움직이는 모습을 보여주는 편이 낫다. 애니메이션이라는 단어가 머릿속에 남았다. 구체적인 형태는 아직 없지만, 방향은 정해졌다.\",\"en\":\"$16\"}}}]]}]]}]\n"])</script></body></html>
