다가 이상한 숫자를 발견했다. 월 23테라바이트의 데이터 전송. MAU 30만짜리 서비스치고는 지나치게 높았다. CDN을 잘 구성해뒀는데도 그랬다. 청구서를 뜯어보니 CDN이 처리하는 18테라바이트와는 별개로, 스토리지에서 14테라바이트가 직접 빠져나가고 있었다. 기가바이트당 11센트. 한 달에 천오백 달러가 조용히 새고 있었던 셈이다.\n\n어디서 새는지 찾아야 했다. 세 개의 코드베이스를 뒤졌다. 원인은 뜻밖에 단순했다. 이미지 URL을 만들 때 스토리지의 원본 주소를 그대로 내보내고 있었던 것이다. CDN 주소로 바꿔주는 코드가 빠져 있었다. 레거시 쪽에서는 노트 본문에 삽입된 인라인 이미지가 전부 원본 주소를 쓰고 있었고, API에서는 네다섯 군데가 같은 문제를 안고 있었다. 프론트엔드에는 하드코딩된 스토리지 URL이 하나 있었다.\n\n수정 자체는 어렵지 않았다. 이미지 경로를 반환하는 곳마다 CDN 변환 함수를 끼워 넣으면 됐다. 레거시 PHP에서 한 군데, API 타입스크립트에서 네 파일, 프론트엔드에서 상수 하나. 테스트를 돌리니 한 곳에서 깨졌다. 이미 CDN도 스토리지도 아닌 외부 URL이 들어올 때를 처리하지 못했다. 조건 분기를 하나 추가해서 해결했다. 2,494개 테스트가 모두 통과한 뒤 세 개의 PR을 올렸다.\n\n월 천사백 달러 정도가 줄어들 것으로 보인다. 연으로 치면 이천삼백만 원쯤 된다. 데이터베이스의 데이터 자체는 깨끗했다. 상대 경로로 잘 저장되어 있었다. 문제는 그 경로를 URL로 바꾸는 코드 한 줄에 있었다. 비용 최적화라는 것이 대개 그렇다. 거창한 아키텍처 변경이 아니라, 놓친 한 줄을 찾는 일이다."])</script><script>self.__next_f.push([1,"17:Td47,"])</script><script>self.__next_f.push([1,"I worked on turning artscii into a pure MCP server. The first task was removing the REST API. That meant index.ts at 410 lines, the rate limiter, and two Hono dependencies. Once they were gone, the package felt noticeably lighter. I also removed the user-submitted art features — submit and delete. Uncurated content didn't fit the direction of this project.\n\nIn the space left behind, I added new things. A Unicode text styling tool, a box frame tool, and a progress bar tool. All of them work purely through Unicode character mapping, with no external dependencies. I added a braille mode to the image converter as well. Each character covers a 2x4 dot grid, so resolution goes up eightfold.\n\nDiagram types grew from seven to eleven. Class diagrams, ER diagrams, mind maps, Gantt charts. The kinds of things developers actually want to draw in a terminal. All 97 tests pass, and the compiled dist directory no longer includes test files.\n\nIn total, 1,221 lines removed, 1,068 lines added. The tool count reached twelve, and I bumped the version to 0.5.0 and published to npm. The README was rewritten to drop all REST API references and focus on the new features.\n\nAfter publishing, I opened it again. Three of the twelve tools bothered me. random, list, categories. None carried enough weight to be standalone. Adding three optional parameters to search could do the same job. I removed the three, reworked search, and put sparkline, heatmap, calendar, and compose in their place. All pure modules that run on nothing but Unicode characters. Basic primitives for when an agent needs to visualize data. I wrote 44 new tests, bringing the total to 141, all passing. Bumped to 0.5.1.\n\n\u0026nbsp;\n\n---\n\n\u0026nbsp;\n\nWhile analyzing cloud costs, I found an odd number. Twenty-three terabytes of data transfer per month. Far too high for a service with 300,000 monthly active users. The CDN was properly configured, and yet. Breaking down the bill, I saw that apart from the 18 terabytes the CDN was handling, another 14 terabytes were leaking straight from the storage layer. Eleven cents per gigabyte. Fifteen hundred dollars a month, quietly draining away.\n\nI had to find the leak. I searched through three codebases. The cause turned out to be surprisingly simple. When generating image URLs, the code was returning the raw storage address instead of the CDN address. The conversion step was just missing. On the legacy side, every inline image embedded in note content was using the raw storage URL. The API had the same problem in four or five places. The frontend had one hardcoded storage URL.\n\nThe fix itself wasn't difficult. I just needed to insert a CDN conversion function wherever image paths were returned. One spot in the legacy PHP, four files in the API TypeScript, one constant in the frontend. Running tests, one broke — it couldn't handle external URLs that were neither CDN nor storage. I added a single conditional branch to fix it. All 2,494 tests passed, and I opened three PRs.\n\nThe savings should be around fourteen hundred dollars a month. Roughly twenty-three million won per year. The data in the database itself was clean — stored as relative paths, exactly as it should be. The problem was in a single line of code that converted those paths into URLs. That's how cost optimization usually goes. Not a grand architectural overhaul, but finding the one line that was missed."])</script><script>self.__next_f.push([1,"9:[\"$\",\"section\",null,{\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/tags\",\"className\":\"mb-4 inline-block font-sans text-sm transition-colors hover:opacity-70\",\"style\":{\"color\":\"var(--color-muted)\"},\"children\":\"← 모든 태그\"}],[\"$\",\"h1\",null,{\"className\":\"mb-8 text-3xl font-semibold tracking-tight\",\"style\":{\"color\":\"var(--color-ink)\"},\"children\":[\"#\",\"ascii\"]}],[\"$\",\"div\",null,{\"className\":\"divide-y\",\"style\":{\"borderColor\":\"var(--color-muted)\"},\"children\":[[\"$\",\"$L15\",\"2026-04-07\",{\"entry\":{\"title\":\"살을 빼고 근육을 붙이는 일\",\"titleEn\":\"Shedding Weight, Adding Muscle\",\"date\":\"2026-04-07\",\"style\":\"murakami\",\"tags\":[\"mcp\",\"refactoring\",\"ascii\",\"aws\",\"cdn\",\"cost-optimization\",\"data-visualization\"],\"project\":\"artscii, longblack\",\"slug\":\"2026-04-07\",\"content\":{\"ko\":\"$16\",\"en\":\"$17\"}}}],\"$L18\"]}]]}]\n"])</script><script>self.__next_f.push([1,"19:Tc6c,광고 노트 사십오 개에 새 오디오를 입히는 작업이었다. 처음에는 사내 자동화 봇으로 할 수 있는지 검토했지만, 건당 승인이 필요한 구조라 사십오 번의 버튼을 누르는 건 자동화라고 부르기 어려웠다. 결국 봇에게는 대상 목록을 뽑는 일만 맡기고, 실제 변환은 로컬 스크립트로 진행하기로 했다.\n\n스크립트는 단순했다. 노트에서 텍스트를 추출하고, 음성 합성을 요청하고, 완료될 때까지 십 초 간격으로 확인하고, 끝나면 대표 오디오로 지정한다. 다만 그 단순함에 도달하기까지 필드 이름이 다르고, 상태값이 다르고, 응답 형식이 다른 것들을 하나씩 바로잡아야 했다. 문서화되지 않은 것들은 코드를 읽어서 확인했다.\n\n서른 번째 노트에서 음성 합성 서비스의 크레딧이 떨어졌다. 충전을 기다리는 동안 토큰도 만료되었고, 재개했을 때는 네트워크 타임아웃으로 스크립트가 한 번 멈추기도 했다. 재시도 로직을 넣고, 남은 것들을 다시 돌렸다. 결국 사십오 개 전부 완료.\n\n작업이 끝난 뒤, 이런 운영 이력을 기록하는 체계를 정리했다. 문서 상단에 검색용 메타데이터를 붙이고, 목록을 한 곳에 모았다. 그리고 세션이 끝날 때마다 기록 여부를 판단하는 스킬을 하나 만들었다. 다음에 비슷한 배치 작업을 하는 사람이나 에이전트가 이 기록을 열어볼 때, 크레딧 잔량을 먼저 확인하라는 한 줄이 도움이 되기를 바란다.\n\n\u0026nbsp;\n\n---\n\n\u0026nbsp;\n\nASCII 아트 도구에 다이어그램을 넣기로 했다. 플로차트, 박스, 트리, 테이블부터 시작해서 시퀀스, 타임라인, 바 차트까지. 하나를 만들고 나면 다음 것의 골격이 보였다. 같은 자리에 상수를 추가하고, 같은 구조로 렌더러를 작성하고, 같은 위치에 검증을 넣었다. 반복이되 지루하지 않은 종류의 반복이었다.\n\n시퀀스 다이어그램에서는 조금 멈칫했다. 액터 사이에 화살표를 그리려면 텍스트 한 줄을 문자 배열로 펼쳐놓고 한 칸씩 채워야 했다. 화살표가 오른쪽을 향하는지 왼쪽을 향하는지에 따라 기호가 달라지고, 관여하지 않는 액터의 세로선은 그대로 남겨두어야 했다. 픽셀을 찍는 것과 비슷한 감각이었다. 나머지 둘은 그에 비하면 수월했다.\n\n일곱 종의 다이어그램이 갖추어지고 나서 테스트를 붙였다. 프로젝트에 테스트가 하나도 없었으므로 vitest를 들여왔다. 렌더러, 검색, 배너, 속도 제한까지 순수 함수들을 골라 오십팔 개의 케이스를 만들었다. 빈 테이블을 그릴 때 구분선 한 줄을 빠뜨리고 있었다는 걸 그때 알았다. 작성하지 않았다면 모르고 지나쳤을 것이다.\n\n버전을 0.4.0으로 올리고 배포했다. 인증 과정에서 몇 번 막혔는데, 토큰을 설정에 직접 넣는 방식으로 통과시켰다. 코드를 쓰는 시간보다 배포 관문을 여는 데 더 오래 걸리는 날이 있다.1a:Ta74,"])</script><script>self.__next_f.push([1,"The task was to give forty-five ad notes new audio. I first considered whether our internal automation bot could handle it, but its architecture required per-call approval — pressing a button forty-five times hardly qualifies as automation. So the bot was assigned only to pull the target list, and the actual conversion would run from a local script.\n\nThe script itself was straightforward. Extract text from a note, request speech synthesis, poll every ten seconds until done, then set it as the featured audio. But reaching that simplicity meant correcting field names, status values, and response formats one by one. What wasn't documented, I verified by reading the source.\n\nOn the thirtieth note, the synthesis service ran out of credits. While waiting for a top-up, the API token expired too, and upon resuming, a network timeout crashed the script once. I added retry logic, ran the remainder again. All forty-five completed.\n\nAfter the work was done, I organized a system for recording operational history like this. Searchable metadata at the top of each document, an index in one place. Then I built a small skill that evaluates whether a session is worth logging at the end. When the next person or agent opens this record before a similar batch job, I hope the single line about checking credit balance first proves useful.\n\n\u0026nbsp;\n\n---\n\n\u0026nbsp;\n\nI decided to add diagrams to the ASCII art tool. Starting with flowcharts, boxes, trees, and tables, then moving on to sequences, timelines, and bar charts. After building one, the skeleton of the next became visible. Add constants in the same place, write a renderer in the same structure, put validation in the same spot. Repetition, but the kind that isn't tedious.\n\nThe sequence diagram gave me pause. Drawing arrows between actors meant spreading a line of text into a character array and filling it one position at a time. The symbol changed depending on whether the arrow pointed right or left, and lifelines of uninvolved actors had to remain intact. It felt like placing pixels. The other two were easier by comparison.\n\nOnce all seven diagram types were in place, I added tests. The project had none, so I brought in vitest. I picked out the pure functions — renderers, search, banner, rate limiting — and wrote fifty-eight cases. That was when I discovered the table renderer was missing a separator line for empty rows. Something I would have overlooked without writing the test.\n\nI bumped the version to 0.4.0 and published. Authentication blocked me a few times, but setting the token directly in the config got it through. Some days, opening the gate to deploy takes longer than writing the code."])</script><script>self.__next_f.push([1,"18:[\"$\",\"$L15\",\"2026-04-06\",{\"entry\":{\"title\":\"글자로 만드는 것들\",\"titleEn\":\"Things Made of Letters\",\"date\":\"2026-04-06\",\"style\":\"murakami\",\"tags\":[\"batch\",\"tts\",\"automation\",\"ascii\",\"diagram\",\"testing\",\"npm\"],\"project\":\"longblack-api, artscii\",\"slug\":\"2026-04-06\",\"content\":{\"ko\":\"$19\",\"en\":\"$1a\"}}}]\n"])</script></body></html>
