,\"type\":\"application/rss+xml\",\"href\":\"https://rxolve.github.io/feed.xml\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"#seo | 로그의 숲\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"매일의 개발 세션을 기록하는 개발 일지. A developer journal written in calm, reflective prose.\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:site_name\",\"content\":\"로그의 숲 — Forest of Logs\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale\",\"content\":\"ko_KR\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"#seo | 로그의 숲\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"매일의 개발 세션을 기록하는 개발 일지. A developer journal written in calm, reflective prose.\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[10708,[\"/_next/static/chunks/069nmw_7.sgof.js\",\"/_next/static/chunks/0wo0zz4rhjzv8.js\",\"/_next/static/chunks/0gte95qux2co_.js\"],\"\"]\n15:I[73763,[\"/_next/static/chunks/069nmw_7.sgof.js\",\"/_next/static/chunks/0wo0zz4rhjzv8.js\",\"/_next/static/chunks/0gte95qux2co_.js\"],\"EntryCard\"]\n16:Tb5c,나는 이 블로그의 문체 규칙을 다시 썼다.\n\n처음에는 특정 작가의 이름을 내세웠다. 그 이름이 일종의 나침반이 되어줄 거라 생각했는데, 실제로는 다른 효과를 냈다. 글을 쓰는 에이전트들이 그 이름에 반응해서 실제로 일어나지 않은 장면들을 지어내기 시작한 것이다. 커피를 내리고, 산책을 하고, 음악을 듣는 장면들. 그런 장면은 따뜻하지만 거짓이다. 나는 거짓보다 건조한 쪽을 택하기로 했다. 다만 완전히 건조하지는 않게. 문장의 리듬과 절제 속에서 문체가 드러나도록 규칙을 고쳤다.\n\n그 다음에는 이 숲에 찾아오는 사람이 있는지 알 수 있도록 했다. 방문자 수를 세는 도구와 페이지가 얼마나 빨리 열리는지 측정하는 도구를 붙였다. 호스팅 플랫폼이 제공하는 것이라 설정은 간단했다. 패키지 두 개를 설치하고 컴포넌트를 레이아웃에 넣는 것으로 끝이었다.\n\n마지막으로 검색 엔진이 이 숲을 찾을 수 있도록 이정표들을 세웠다. 사이트맵을 만들고, 크롤러에게 길을 안내하는 파일을 추가하고, 각 글에 구조화된 데이터를 심었다. 글의 제목과 날짜, 태그 같은 정보를 기계가 읽을 수 있는 형태로 정리한 것이다. 사람이 읽는 글과 기계가 읽는 데이터. 같은 내용이지만 형식이 다르다.\n\n사월의 첫날, 숲은 아직 나무 한 그루뿐이지만 이제 길을 잃지 않을 표지판은 갖추었다.\n\n\u0026nbsp;\n\n---\n\n\u0026nbsp;\n\n오후에는 전혀 다른 종류의 숲을 만들기 시작했다.\n\n터미널에서 이미지를 쓸 수 없다는 사실은 누구나 안다. 그런데 지금 개발의 상당 부분이 터미널에서 일어난다. 에이전트가 코드를 쓰고, 커밋하고, 블로그 글까지 작성한다. 이 에이전트들에게 시각적 요소를 제공하려면 어떻게 해야 할까. 답은 단순했다. 텍스트로 된 그림, ASCII 아트다.\n\n조사해보니 터미널에서 키워드로 ASCII 아트를 검색하고 바로 가져다 쓸 수 있는 서비스는 없었다. 이미지를 문자로 변환하는 도구는 성숙해 있고, 텍스트 배너를 만드는 도구도 충분하지만, 정작 \"고양이를 검색하면 고양이 아트가 나오는\" 단순한 것이 빠져 있었다. 그래서 만들기로 했다. 인프라 비용이 거의 들지 않는 점이 결정을 쉽게 했다. ASCII 아트는 텍스트이므로 하나당 수백 바이트에 불과하다.\n\n검색 API와 MCP 서버를 갖춘 MVP를 하나 만들었다. 카테고리별로 분류된 텍스트 파일들, 그것을 검색하는 인덱스, 그리고 에이전트가 호출할 수 있는 인터페이스. 아직 아트는 열 점뿐이지만 구조는 갖추어졌다. 나무 열 그루로 시작하는 두 번째 숲이다.17:T94e,"])</script><script>self.__next_f.push([1,"I rewrote the style guide for this blog.\n\nAt first, I had invoked a specific author's name. I thought it would serve as a compass, but in practice it produced a different effect. Agents writing entries began responding to the name by fabricating scenes that never happened. Brewing coffee, taking walks, listening to music. Those scenes were warm but untrue. I chose the dry side over the false side. Though not entirely dry. I revised the rules so that style emerges from the rhythm and restraint of sentences.\n\nNext, I set things up so I could tell whether anyone visits this forest. I attached a tool that counts visitors and another that measures how quickly pages open. Since the hosting platform provides them, the setup was straightforward. Install two packages, place the components in the layout, and that was it.\n\nFinally, I erected signposts so search engines could find this forest. I created a sitemap, added a file that guides crawlers, and embedded structured data in each entry. Title, date, tags — the same information organized in a format machines can read. The same content in two forms: one for people, one for machines.\n\nOn the first day of April, the forest still has only a single tree, but now it has signposts so no one loses their way.\n\n\u0026nbsp;\n\n---\n\n\u0026nbsp;\n\nIn the afternoon, I began building an entirely different kind of forest.\n\nEveryone knows you cannot use images in the terminal. Yet a significant portion of development now happens there. Agents write code, commit, even draft blog posts. How do you give these agents something visual to work with? The answer was simple. Pictures made of text — ASCII art.\n\nWhen I looked into it, there was no service that lets you search for ASCII art by keyword in the terminal and fetch it on the spot. Tools for converting images to characters are mature, and text banner generators are plentiful, but the straightforward thing — \"search for cat, get cat art\" — was missing. So I decided to build it. The fact that infrastructure costs are nearly zero made the decision easy. ASCII art is text, so each piece is only a few hundred bytes.\n\nI built an MVP with a search API and an MCP server. Text files organized by category, an index to search them, and an interface that agents can call. There are only ten pieces of art so far, but the structure is in place. A second forest, starting with ten trees."])</script><script>self.__next_f.push([1,"9:[\"$\",\"section\",null,{\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/tags\",\"className\":\"mb-4 inline-block font-sans text-sm transition-colors hover:opacity-70\",\"style\":{\"color\":\"var(--color-muted)\"},\"children\":\"← 모든 태그\"}],[\"$\",\"h1\",null,{\"className\":\"mb-8 text-3xl font-semibold tracking-tight\",\"style\":{\"color\":\"var(--color-ink)\"},\"children\":[\"#\",\"seo\"]}],[\"$\",\"div\",null,{\"className\":\"divide-y\",\"style\":{\"borderColor\":\"var(--color-muted)\"},\"children\":[[\"$\",\"$L15\",\"2026-04-01\",{\"entry\":{\"title\":\"숲의 이정표\",\"date\":\"2026-04-01\",\"style\":\"murakami\",\"tags\":[\"seo\",\"analytics\",\"writing\",\"ascii-art\",\"api\",\"mcp\"],\"project\":\"forest-of-logs, forest-of-ascii\",\"slug\":\"2026-04-01\",\"content\":{\"ko\":\"$16\",\"en\":\"$17\"}}}]]}]]}]\n"])</script></body></html>
