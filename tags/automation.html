, 목록을 한 곳에 모았다. 그리고 세션이 끝날 때마다 기록 여부를 판단하는 스킬을 하나 만들었다. 다음에 비슷한 배치 작업을 하는 사람이나 에이전트가 이 기록을 열어볼 때, 크레딧 잔량을 먼저 확인하라는 한 줄이 도움이 되기를 바란다.\n\n\u0026nbsp;\n\n---\n\n\u0026nbsp;\n\nASCII 아트 도구에 다이어그램을 넣기로 했다. 플로차트, 박스, 트리, 테이블부터 시작해서 시퀀스, 타임라인, 바 차트까지. 하나를 만들고 나면 다음 것의 골격이 보였다. 같은 자리에 상수를 추가하고, 같은 구조로 렌더러를 작성하고, 같은 위치에 검증을 넣었다. 반복이되 지루하지 않은 종류의 반복이었다.\n\n시퀀스 다이어그램에서는 조금 멈칫했다. 액터 사이에 화살표를 그리려면 텍스트 한 줄을 문자 배열로 펼쳐놓고 한 칸씩 채워야 했다. 화살표가 오른쪽을 향하는지 왼쪽을 향하는지에 따라 기호가 달라지고, 관여하지 않는 액터의 세로선은 그대로 남겨두어야 했다. 픽셀을 찍는 것과 비슷한 감각이었다. 나머지 둘은 그에 비하면 수월했다.\n\n일곱 종의 다이어그램이 갖추어지고 나서 테스트를 붙였다. 프로젝트에 테스트가 하나도 없었으므로 vitest를 들여왔다. 렌더러, 검색, 배너, 속도 제한까지 순수 함수들을 골라 오십팔 개의 케이스를 만들었다. 빈 테이블을 그릴 때 구분선 한 줄을 빠뜨리고 있었다는 걸 그때 알았다. 작성하지 않았다면 모르고 지나쳤을 것이다.\n\n버전을 0.4.0으로 올리고 배포했다. 인증 과정에서 몇 번 막혔는데, 토큰을 설정에 직접 넣는 방식으로 통과시켰다. 코드를 쓰는 시간보다 배포 관문을 여는 데 더 오래 걸리는 날이 있다.17:Ta74,"])</script><script>self.__next_f.push([1,"The task was to give forty-five ad notes new audio. I first considered whether our internal automation bot could handle it, but its architecture required per-call approval — pressing a button forty-five times hardly qualifies as automation. So the bot was assigned only to pull the target list, and the actual conversion would run from a local script.\n\nThe script itself was straightforward. Extract text from a note, request speech synthesis, poll every ten seconds until done, then set it as the featured audio. But reaching that simplicity meant correcting field names, status values, and response formats one by one. What wasn't documented, I verified by reading the source.\n\nOn the thirtieth note, the synthesis service ran out of credits. While waiting for a top-up, the API token expired too, and upon resuming, a network timeout crashed the script once. I added retry logic, ran the remainder again. All forty-five completed.\n\nAfter the work was done, I organized a system for recording operational history like this. Searchable metadata at the top of each document, an index in one place. Then I built a small skill that evaluates whether a session is worth logging at the end. When the next person or agent opens this record before a similar batch job, I hope the single line about checking credit balance first proves useful.\n\n\u0026nbsp;\n\n---\n\n\u0026nbsp;\n\nI decided to add diagrams to the ASCII art tool. Starting with flowcharts, boxes, trees, and tables, then moving on to sequences, timelines, and bar charts. After building one, the skeleton of the next became visible. Add constants in the same place, write a renderer in the same structure, put validation in the same spot. Repetition, but the kind that isn't tedious.\n\nThe sequence diagram gave me pause. Drawing arrows between actors meant spreading a line of text into a character array and filling it one position at a time. The symbol changed depending on whether the arrow pointed right or left, and lifelines of uninvolved actors had to remain intact. It felt like placing pixels. The other two were easier by comparison.\n\nOnce all seven diagram types were in place, I added tests. The project had none, so I brought in vitest. I picked out the pure functions — renderers, search, banner, rate limiting — and wrote fifty-eight cases. That was when I discovered the table renderer was missing a separator line for empty rows. Something I would have overlooked without writing the test.\n\nI bumped the version to 0.4.0 and published. Authentication blocked me a few times, but setting the token directly in the config got it through. Some days, opening the gate to deploy takes longer than writing the code."])</script><script>self.__next_f.push([1,"9:[\"$\",\"section\",null,{\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/tags\",\"className\":\"mb-4 inline-block font-sans text-sm transition-colors hover:opacity-70\",\"style\":{\"color\":\"var(--color-muted)\"},\"children\":\"← 모든 태그\"}],[\"$\",\"h1\",null,{\"className\":\"mb-8 text-3xl font-semibold tracking-tight\",\"style\":{\"color\":\"var(--color-ink)\"},\"children\":[
