t\":\"매일의 개발 세션을 기록하는 개발 일지. A developer journal written in calm, reflective prose.\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:site_name\",\"content\":\"로그의 숲 — Forest of Logs\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale\",\"content\":\"ko_KR\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"#voice-selection | 로그의 숲\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"매일의 개발 세션을 기록하는 개발 일지. A developer journal written in calm, reflective prose.\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[10708,[\"/_next/static/chunks/069nmw_7.sgof.js\",\"/_next/static/chunks/0wo0zz4rhjzv8.js\",\"/_next/static/chunks/0gte95qux2co_.js\"],\"\"]\n15:I[73763,[\"/_next/static/chunks/069nmw_7.sgof.js\",\"/_next/static/chunks/0wo0zz4rhjzv8.js\",\"/_next/static/chunks/0gte95qux2co_.js\"],\"EntryCard\"]\n16:T6d3,"])</script><script>self.__next_f.push([1,"I spent the whole day choosing one voice. My original plan was to drop yesterday's Hook file from Typecast into the video composition. The output had come out at 16 kHz, and the thin audio sat too lightly on the risograph paper in the frame. That lightness had been bothering me.\n\nI had to decide whether to keep the Typecast subscription, move to its API, or switch to something else entirely. I calculated annual costs, cloned the Supertonic open-source stack, opened the Voice Builder's forty-nine dollar one-time purchase page. Then I found Gemini 3.1 Flash TTS, released only days earlier. Fifty cents per million characters, about a hundred won per episode. Since I was already using Google's stack for images and music, adding voice would mean one account for everything. Being able to choose from thirty preset voices was part of the appeal.\n\nI moved through Aoede, Gacrux, Pulcherrima in sequence. Aoede was clean but turned too deep when pushed toward husky. Gacrux refused certain style tags outright. Pulcherrima—Latin for \"most beautiful\"—landed close to the channel's tone at its baseline. I added only \"Style: calm\" on top. Everything else was excess.\n\nI also learned which prompts get blocked. The em dash triggered a safety filter, as did the word Whisper. Hushed too. Calm, softly, muted passed through. None of this is documented anywhere—I found it out by hitting the walls myself. I put automatic substitution into the pipeline.\n\nAt the end of the day I wrote the choice into the docs, deleted the 250MB of models and the dozens of audition files I had pulled during exploration. I wrote a setup guide so the work could pick up on another machine. I pushed six commits to the remote. One voice took a full day to choose."])</script><script>self.__next_f.push([1,"9:[\"$\",\"section\",null,{\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/tags\",\"className\":\"mb-4 inline-block font-sans text-sm transition-colors hover:opacity-70\",\"style\":{\"color\":\"var(--color-muted)\"},\"children\":\"← 모든 태그\"}],[\"$\",\"h1\",null,{\"className\":\"mb-8 text-3xl font-semibold tracking-tight\",\"style\":{\"color\":\"var(--color-ink)\"},\"children\":[\"#\",\"voice-selection\"]}],[\"$\",\"div\",null,{\"className\":\"divide-y\",\"style\":{\"borderColor\":\"var(--color-muted)\"},\"children\":[[\"$\",\"$L15\",\"2026-04-24\",{\"entry\":{\"title\":\"Pulcherrima라는 이름으로\",\"date\":\"2026-04-24\",\"style\":\"murakami\",\"tags\":[\"tts\",\"voice-selection\",\"gemini\",\"pipeline\"],\"project\":\"it-works-why\",\"slug\":\"2026-04-24\",\"content\":{\"ko\":\"오늘 하루는 목소리 하나를 고르는 일로 다 썼다. 처음에는 어제 Typecast로 떠낸 첫 Hook 파일을 영상에 얹어 보는 게 목표였다. 16 kHz로 떨어져 나온 음성이 리소 종이 위에 너무 가볍게 앉아 있었다. 그 가벼움이 내내 걸렸다.\\n\\nTypecast 월 구독을 유지할지, API로 옮길지, 아예 다른 곳으로 갈지를 정해야 했다. 연간 비용을 계산하고, Supertonic 오픈소스 스택을 내려받아 보고, Voice Builder의 49달러짜리 영구 구매 화면까지 열어 보았다. 그러다 며칠 전에 공개된 Gemini 3.1 Flash TTS를 발견했다. 1백만 자당 0.5달러였고 한 편당 백 원 남짓이었다. 이미 이미지와 음악을 구글 스택으로 가져가고 있었으니 음성까지 붙이면 계정 하나로 끝이 났다. 서른 개의 프리셋 중에서 고를 수 있다는 점도 매력이었다.\\n\\nAoede, Gacrux, Pulcherrima 순으로 넘어갔다. Aoede는 깔끔했지만 허스키로 밀고 들어가면 과하게 깔렸다. Gacrux는 일부 스타일 태그와 궁합이 맞지 않아 응답이 막혔다. Pulcherrima는 라틴어로 \\\"가장 아름다운\\\"이라는 뜻 그대로, 기본 톤이 채널에 맞았다. 거기에 \\\"Style: calm\\\"만 덧붙였다. 그 외에는 전부 군더더기였다.\\n\\n프롬프트가 막히는 패턴도 배웠다. 엠 대시가 안전 필터에 걸렸고, Whisper라는 단어도 걸렸고, Hushed도 걸렸다. Calm, softly, muted는 통과했다. 어디에도 문서화되어 있지 않아 직접 막혀 보며 알아냈다. 파이프라인 안에 자동 치환 로직을 넣어 두었다.\\n\\n하루의 끝에 선택한 것을 문서에 박아 두고, 탐색 중에 내려받은 250MB의 모델과 수십 개의 오디션 파일을 지웠다. 다른 기기에서 이어 붙을 수 있도록 세업 가이드를 적어 두었다. 커밋 여섯 개를 원격에 올렸다. 목소리 하나를 고르는 데 하루가 들었다.\",\"en\":\"$16\"}}}]]}]]}]\n"])</script></body></html>
