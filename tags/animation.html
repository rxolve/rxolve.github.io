h([1,"Around eleven in the morning I opened an empty directory. It was the third fork in the road that started at artscii and continued through pixscii, and this time the material was vectors. I built a static server that set up an SVG scene graph, placed rectangles, circles, and text, then rasterized to PNG via resvg. Four palettes in Kurzgesagt tones. Eight tools, twenty-five files. I called it vecscii.\n\nBefore lunch I added the animation engine. Keyframes on each node, numbers and colors interpolated along easing curves, every frame stamped out through structuredClone. Starting around two in the afternoon, commits went up two minutes apart. Reverse playback, pingpong, path animation tracing SVG curves, GIF export, APNG export, spritesheet tiling. Attach a feature, run the tests, move to the next. At three I published v0.1.0 to npm.\n\nIn the evening I connected Gemini. A pipeline that generates a sprite sheet from a single line of text, auto-slices the frames, strips the white background, and places them as image nodes in the scene. I opened a PR and merged it. By that point the tool count had reached nineteen.\n\nThen I changed the name. vecscii had started as the name of a static vector tool, but now this thing generates, composes, animates, and exports. AI animation workbench suited it better. fluxcii. I erased the old name from package.json, server config, and every source file. One more PR, and that too was merged.\n\nLastly I tidied the local folder. The vecscii inside the code was already gone, but the directory name lingered. Renaming hit a path conflict, so I deleted the old folder and cloned fluxcii fresh. After the move, a grep turned up nothing. What was born from an empty directory in a single day had, by the end of that same day, found its proper name."])</script><script>self.__next_f.push([1,"9:[\"$\",\"section\",null,{\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/tags\",\"className\":\"mb-4 inline-block font-sans text-sm transition-colors hover:opacity-70\",\"style\":{\"color\":\"var(--color-muted)\"},\"children\":\"← 모든 태그\"}],[\"$\",\"h1\",null,{\"className\":\"mb-8 text-3xl font-semibold tracking-tight\",\"style\":{\"color\":\"var(--color-ink)\"},\"children\":[\"#\",\"animation\"]}],[\"$\",\"div\",null,{\"className\":\"divide-y\",\"style\":{\"borderColor\":\"var(--color-muted)\"},\"children\":[[\"$\",\"$L15\",\"2026-04-13\",{\"entry\":{\"title\":\"이름이 바뀌는 순간\",\"titleEn\":\"The Moment a Name Changes\",\"date\":\"2026-04-13\",\"style\":\"murakami\",\"tags\":[\"fluxcii\",\"svg\",\"animation\",\"mcp\"],\"project\":\"fluxcii\",\"slug\":\"2026-04-13\",\"content\":{\"ko\":\"아침 열한 시 무렵, 빈 디렉토리 하나를 열었다. artscii에서 pixscii로 이어진 길의 세 번째 갈래였고, 이번에는 벡터라는 재료를 다룰 차례였다. SVG 씬 그래프를 세우고 사각형과 원과 텍스트를 올려놓고 resvg로 PNG를 찍어내는 정적 서버를 만들었다. 쿠르츠게작트 색감의 팔레트 네 벌을 준비했다. 도구 여덟 개, 파일 스물다섯 개. 이름은 vecscii라고 지었다.\\n\\n점심 전에 애니메이션 엔진을 올렸다. 노드마다 키프레임을 걸고, 이징 곡선을 따라 숫자와 색을 보간하고, structuredClone으로 매 프레임을 찍어내는 구조였다. 오후 두 시부터는 커밋이 2분 간격으로 올라갔다. 역재생, 핑퐁, SVG 경로를 따라 노드를 움직이는 패스 애니메이션, GIF 익스포트, APNG 익스포트, 스프라이트시트 타일링. 한 기능을 붙이고, 테스트를 돌리고, 다음 기능으로 넘어가는 리듬이었다. 세 시에 v0.1.0을 npm에 퍼블리시했다.\\n\\n저녁에 Gemini를 연결했다. 텍스트 한 줄로 스프라이트 시트를 생성하고, 프레임을 자동으로 잘라내고, 흰 배경을 지워서 씬에 이미지 노드로 올리는 파이프라인이었다. PR을 올리고 머지했다. 이 시점에서 도구는 열아홉 개가 되어 있었다.\\n\\n그런 다음 이름을 바꿨다. vecscii는 정적 벡터 도구로 출발한 이름이었는데, 지금 이 도구는 생성하고 합성하고 움직이고 내보낸다. AI 애니메이션 워크벤치라는 말이 더 어울렸다. fluxcii. package.json과 서버 설정과 소스 코드 전체에서 옛 이름을 지웠다. PR을 하나 더 올렸고, 그것도 머지됐다.\\n\\n마지막으로 로컬 폴더를 정리했다. 코드 안의 vecscii는 이미 사라졌지만 디렉토리 이름만 남아 있었다. 이름을 바꾸려 했으나 경로가 꼬여서, 결국 옛 폴더를 지우고 fluxcii를 새로 클론했다. 이사가 끝나고 grep을 돌려보니 vecscii는 어디에도 없었다. 하루 만에 빈 디렉토리에서 태어난 것이 제 이름을 갖게 되었다.\",\"en\":\"$16\"}}}],\"$L17\"]}]]}]\n"])</script><script>self.__next_f.push([1,"18:T5e5,"])</script><script>self.__next_f.push([1,"There were thirteen tools. Giving an agent thirteen choices is not kindness but confusion. I removed the calendar. Any language model can draw a calendar on its own. Unicode text styling went too. There was no reason to keep something that is not ASCII art inside an ASCII tool. I merged the progress bar, sparkline, and heatmap into one. Thirteen became ten.\n\nThen I looked at each art again, one by one. Twenty out of a hundred and one were unrecognizable in the terminal. The car was a blob. The crown was flat. If showing it draws a \"what is this\" reaction, that art damages the product. I deleted twenty. The number shrank, but every remaining piece had a clear shape.\n\nIn the afternoon I built animations. At first I made ten fixed animations — a bouncing ball, a blinking face. But this approach was a dead end. Adding a new motion applied to only one art. I changed the approach. I separated art as the noun and motion as the verb. Attach bounce to apple and the apple bounces. Attach shake to trophy and the trophy shakes. Attach reveal to lock and the lock appears line by line. Eighty-one nouns and nine verbs make seven hundred twenty-nine sentences. Add one noun and nine sentences appear at once. Add one verb and eighty-one sentences appear at once.\n\nI watched an apple actually bounce in the terminal. Running the script the tool returned, the apple-shaped characters moved up and down. Language models cannot draw. But this tool can. That single sentence became the message of this project."])</script><script>self.__next_f.push([1,"17:[\"$\",\"$L15\",\"2026-04-08\",{\"entry\":{\"title\":\"주어와 동사\",\"titleEn\":\"Nouns and Verbs\",\"date\":\"2026-04-08\",\"style\":\"murakami\",\"tags\":[\"mcp\",\"ascii-art\",\"animation\",\"refactoring\"],\"project\":\"artscii\",\"slug\":\"2026-04-08\",\"content\":{\"ko\":\"도구가 열셋이었다. 에이전트에게 열셋의 선택지를 주는 건 친절이 아니라 혼란이다. 달력은 뺐다. 어떤 언어 모델이든 달력 정도는 혼자 그릴 수 있다. 유니코드 텍스트 스타일도 뺐다. 아스키 아트가 아닌 것을 아스키 도구에 넣어둘 이유가 없었다. 프로그레스 바와 스파크라인과 히트맵은 하나로 합쳤다. 열셋이 열로 줄었다.\\n\\n그 다음 아트를 하나씩 다시 들여다봤다. 백한 개 중 스무 개가 터미널에서 알아볼 수 없었다. 자동차는 덩어리였고 왕관은 평면이었다. 보여줬을 때 \\\"이게 뭐야\\\"라는 반응이 나오면 그 아트는 제품을 깎아먹는다. 스무 개를 지웠다. 숫자는 줄었지만 남은 것들은 모두 형태가 선명했다.\\n\\n오후에 애니메이션을 만들었다. 처음에는 통통 뛰는 공, 깜빡이는 얼굴 같은 고정된 애니메이션을 열 개 만들어 넣었다. 그런데 이 방식은 막다른 길이었다. 새로운 움직임을 하나 추가하면 아트 하나에만 적용된다. 접근을 바꿨다. 아트를 주어로, 움직임을 동사로 분리했다. 사과에 튀기를 붙이면 사과가 통통 뛴다. 트로피에 흔들기를 붙이면 트로피가 흔들린다. 자물쇠에 한 줄씩 나타나기를 붙이면 자물쇠가 서서히 드러난다. 여든한 개의 주어와 아홉 개의 동사가 칠백스물아홉 개의 문장을 만든다. 주어를 하나 추가하면 아홉 개의 문장이 동시에 생기고, 동사를 하나 추가하면 여든한 개의 문장이 동시에 생긴다.\\n\\n터미널에서 사과가 실제로 뛰는 걸 봤다. 도구가 돌려준 스크립트를 실행하니 사과 모양의 글자들이 위아래로 움직였다. 언어 모델은 그림을 그릴 수 없다. 하지만 이 도구는 그릴 수 있다. 그 한 문장이 이 프로젝트의 메시지가 되었다.\",\"en\":\"$18\"}}}]\n"])</script></body></html>
