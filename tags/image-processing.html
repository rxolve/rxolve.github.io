orest of Logs\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale\",\"content\":\"ko_KR\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"#image-processing | 로그의 숲\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"매일의 개발 세션을 기록하는 개발 일지. A developer journal written in calm, reflective prose.\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[10708,[\"/_next/static/chunks/069nmw_7.sgof.js\",\"/_next/static/chunks/0wo0zz4rhjzv8.js\",\"/_next/static/chunks/0gte95qux2co_.js\"],\"\"]\n15:I[73763,[\"/_next/static/chunks/069nmw_7.sgof.js\",\"/_next/static/chunks/0wo0zz4rhjzv8.js\",\"/_next/static/chunks/0gte95qux2co_.js\"],\"EntryCard\"]\n16:T633,"])</script><script>self.__next_f.push([1,"artscii already had a tool that converted images into characters. It read brightness values and mapped them to corresponding characters, and it worked well. But it was designed for batch-converting prepared images, not for an agent to hand over an image address at runtime and get an instant result. So I decided to port the same algorithm to a different language.\n\nThe porting itself was not difficult. Composite transparent areas onto a white background, convert to grayscale, shrink, then substitute each pixel with a character. But the way decimal places were truncated differed subtly between the two languages. I initially used rounding, and a review pointed out this could produce a one-row difference. I matched the original by switching to truncation. If you want to claim identical results, you need this kind of precision at the boundaries.\n\nI opened up the conversion through both an API and an agent tool. The agent side handled input validation automatically, but the API side did not. In the first version, malformed requests flowed all the way through unchecked. Over two rounds of review, I added safeguards one by one — external address validation, size limits, internal network blocking. More sophisticated bypass techniques were accepted as tolerable at the current scale.\n\nIn the end I bumped the version and published to the package registry. One command starts the server, pass an image address, and you get character art back in two sizes. The original batch conversion tool stays. It is still useful when regenerating the character drawings that come included."])</script><script>self.__next_f.push([1,"9:[\"$\",\"section\",null,{\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/tags\",\"className\":\"mb-4 inline-block font-sans text-sm transition-colors hover:opacity-70\",\"style\":{\"color\":\"var(--color-muted)\"},\"children\":\"← 모든 태그\"}],[\"$\",\"h1\",null,{\"className\":\"mb-8 text-3xl font-semibold tracking-tight\",\"style\":{\"color\":\"var(--color-ink)\"},\"children\":[\"#\",\"image-processing\"]}],[\"$\",\"div\",null,{\"className\":\"divide-y\",\"style\":{\"borderColor\":\"var(--color-muted)\"},\"children\":[[\"$\",\"$L15\",\"2026-04-03\",{\"entry\":{\"title\":\"같은 알고리즘, 다른 언어\",\"titleEn\":\"Same Algorithm, Different Language\",\"date\":\"2026-04-03\",\"style\":\"murakami\",\"tags\":[\"image-processing\",\"mcp\",\"npm-publish\"],\"project\":\"artscii\",\"slug\":\"2026-04-03\",\"content\":{\"ko\":\"artscii에는 이미지를 문자로 바꾸는 도구가 이미 있었다. 밝기를 읽어서 문자에 대응시키는 방식이었고, 잘 동작했다. 다만 미리 준비한 이미지를 한꺼번에 변환하는 용도였지, 에이전트가 실시간으로 이미지 주소를 건네면 즉시 변환해주는 기능은 아니었다. 그래서 같은 알고리즘을 다른 언어로 옮기기로 했다.\\n\\n옮기는 작업 자체는 어렵지 않았다. 투명한 부분을 흰 배경에 합치고, 흑백으로 바꾸고, 크기를 줄인 뒤 픽셀 하나하나를 문자로 치환하는 흐름이다. 다만 소수점 이하를 잘라내는 방식이 두 언어 사이에서 미묘하게 달랐다. 처음에는 반올림을 썼다가 리뷰에서 한 줄 차이가 날 수 있다는 지적이 나왔고, 원본과 동일하게 버림으로 맞추었다. 똑같은 결과를 내야 한다고 말하려면 이런 경계에서의 정확함이 필요하다.\\n\\n변환 기능을 API와 에이전트 도구 양쪽으로 열었다. 에이전트 쪽은 입력 검증이 자동으로 이루어졌지만, API 쪽은 그렇지 않았다. 첫 버전에서는 엉뚱한 형태의 요청이 내부까지 그대로 흘러들어갔다. 리뷰를 두 번 거치면서 외부 주소 검증, 크기 제한, 내부망 차단 같은 안전장치를 하나씩 달았다. 더 정교한 우회 기법들은 현재 규모에서는 수용하기로 했다.\\n\\n결국 새 버전으로 올려서 패키지 저장소에 배포했다. 명령어 하나로 서버가 뜨고, 이미지 주소를 넘기면 두 가지 크기의 문자 그림이 돌아온다. 원래 있던 일괄 변환 도구는 그대로 남겨두었다. 기본으로 들어 있는 글자 그림들을 다시 만들 때 여전히 쓸모가 있으니까.\",\"en\":\"$16\"}}}]]}]]}]\n"])</script></body></html>
