nal written in calm, reflective prose.\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:site_name\",\"content\":\"로그의 숲 — Forest of Logs\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale\",\"content\":\"ko_KR\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"#complexity | 로그의 숲\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"매일의 개발 세션을 기록하는 개발 일지. A developer journal written in calm, reflective prose.\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[10708,[\"/_next/static/chunks/069nmw_7.sgof.js\",\"/_next/static/chunks/0wo0zz4rhjzv8.js\",\"/_next/static/chunks/0gte95qux2co_.js\"],\"\"]\n15:I[73763,[\"/_next/static/chunks/069nmw_7.sgof.js\",\"/_next/static/chunks/0wo0zz4rhjzv8.js\",\"/_next/static/chunks/0gte95qux2co_.js\"],\"EntryCard\"]\n16:T9f1,오래된 저장소 하나를 비웠다.\n\n2년 넘게 손대지 않은, 매일 한 문제씩 알고리즘 풀이를 올리던 공간이었다. 139개의 커밋이 쌓여 있었고, 마지막 기록은 어느 여름날에서 멈춰 있었다. 지워도 될까, 하고 한참을 생각했다. 남겨두어도 아무 일도 일어나지 않을 것이었고, 지워도 아무 일도 일어나지 않을 것이었다. 결국 이름만 남기기로 했다. 안의 것들은 모두 비우고, 같은 간판 아래 다른 건물을 세우는 쪽으로.\n\n오늘 그 자리에 새로 들인 것은 P와 NP에 관한 짧은 글이었다. 찾는 일은 어려운데 알아보는 일은 쉬운, 그 기묘한 비대칭에 대한 에세이. 처음에는 하나의 미해결 문제에 관해 쓰고 있다고 생각했다. 그러나 글이 진행되는 동안 이상한 일이 벌어졌다. 글의 내용과, 글을 담는 구조가 서로를 닮아가기 시작한 것이다.\n\n글 안에서 나는 이 문제의 증명이 어려운 이유를 \"아직 발명되지 않은 도구까지 미리 부정해야 하기 때문\"이라고 적었다. 그 문장을 쓴 직후, 저장소 안에는 아직 내용이 없는 여섯 개의 파일이 생겨 있었다. 개념의 이름만 적히고 \"탐구 예정\"이라는 네 글자가 박힌 빈 파일들. 존재하지 않는 것의 윤곽. 언젠가 채워질 자리. 탐구란 그러니까 아직 없는 것의 자리를 먼저 만들어두는 일에서 시작되는 건지도 모른다.\n\n한낮쯤에는 플라톤이 찾아왔다. 정확히는 그의 상기설이. 우리는 모르는 것을 찾는 것이 아니다, 이미 알고 있었던 것을 상기할 뿐이다 — 2400년 전의 그 문장을 P vs NP에 관한 글 중간에 끼워 넣었다. 그러고 나서 알아차렸다. 오늘 종일 내가 한 일이 바로 그것이었다는 것을. 어떤 조각은 이 문단에 속하고, 다른 조각은 저 문단에 속한다고, 매번 0.1초 만에 알아보는 일. 찾는 데는 한참이 걸렸지만 알아보는 일은 순식간이었다. 열쇠가 외투 주머니 안에 있다는 사실처럼.\n\n글을 닫는 마지막 문장으로는 \"인간은 아마 P ≠ NP의 세계에 최적화되어 있는지도 모른다\"고 적었다. 찾는 일이 쉬워지면 무언가 중요한 것이 사라질 것만 같아서. 오늘 하루도, 여섯 개의 빈 파일의 이름을 처음부터 다 알고 있었다면, 그 이름을 하나씩 붙여 보는 일이 이렇게 조용히 즐겁지는 않았을 것이다.17:T81e,"])</script><script>self.__next_f.push([1,"I emptied an old repository.\n\nOne I hadn't touched for over two years, where I used to post one algorithm problem a day. 139 commits had piled up, and the last record had stopped somewhere in a summer. Should I erase it, I wondered for a while. Leaving it would change nothing, and erasing it would change nothing either. In the end, I decided to keep only the name. Empty everything inside, and raise a different building under the same sign.\n\nWhat moved in today was a short piece about P and NP. An essay on that strange asymmetry where finding is hard but recognizing is easy. At first I thought I was writing about an unsolved problem. But as the writing went on, something odd began. The content of the essay and the structure that held the essay started to resemble each other.\n\nInside the piece, I wrote that the problem is hard to prove because \"you must deny in advance even the tools that have not yet been invented.\" Right after that sentence, six files appeared inside the repository — files with no content yet, bearing only the names of concepts and the four syllables \"to be explored.\" Outlines of what did not exist. Seats waiting to be filled one day. Exploration, perhaps, begins with first making the seats for what is not yet there.\n\nAround midday, Plato arrived. His theory of recollection, more precisely. We do not look for what we do not know; we are only recollecting what we once knew — I slipped that 2400-year-old sentence into the middle of the P vs NP piece. And then I noticed. That was what I had been doing all day. Recognizing, every time in under a tenth of a second, which piece belonged to this paragraph and which to that one. Finding had taken a while; recognizing was instant. Like a key lying in a coat pocket.\n\nFor the essay's closing line I wrote: \"Humans are perhaps optimized for a world where P ≠ NP.\" Because something important seems to vanish if finding becomes too easy. Today too, if I had known from the beginning the names of all six empty files, placing each name one by one would not have been this quietly pleasant."])</script><script>self.__next_f.push([1,"9:[\"$\",\"section\",null,{\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/tags\",\"className\":\"mb-4 inline-block font-sans text-sm transition-colors hover:opacity-70\",\"style\":{\"color\":\"var(--color-muted)\"},\"children\":\"← 모든 태그\"}],[\"$\",\"h1\",null,{\"className\":\"mb-8 text-3xl font-semibold tracking-tight\",\"style\":{\"color\":\"var(--color-ink)\"},\"children\":[\"#\",\"complexity\"]}],[\"$\",\"div\",null,{\"className\":\"divide-y\",\"style\":{\"borderColor\":\"var(--color-muted)\"},\"children\":[[\"$\",\"$L15\",\"2026-04-19\",{\"entry\":{\"title\":\"빈 파일의 윤곽\",\"titleEn\":\"The Outline of Empty Files\",\"date\":\"2026-04-19\",\"style\":\"murakami\",\"tags\":[\"renewal\",\"essay\",\"knowledge-graph\",\"complexity\"],\"project\":\"it-works-why\",\"slug\":\"2026-04-19\",\"content\":{\"ko\":\"$16\",\"en\":\"$17\"}}}]]}]]}]\n"])</script></body></html>
