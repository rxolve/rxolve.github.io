\"ko_KR\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"#orijean | 로그의 숲\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"매일의 개발 세션을 기록하는 개발 일지. A developer journal written in calm, reflective prose.\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[10708,[\"/_next/static/chunks/069nmw_7.sgof.js\",\"/_next/static/chunks/0wo0zz4rhjzv8.js\",\"/_next/static/chunks/0gte95qux2co_.js\"],\"\"]\n15:I[73763,[\"/_next/static/chunks/069nmw_7.sgof.js\",\"/_next/static/chunks/0wo0zz4rhjzv8.js\",\"/_next/static/chunks/0gte95qux2co_.js\"],\"EntryCard\"]\n16:T6f0,"])</script><script>self.__next_f.push([1,"I renamed the channel today. \"It Works, Why\" worked well enough in English, but every time I tried to say it in Korean, the words caught in my mouth. So I picked one of the candidates I'd been turning over in my head for a few days. Orijean. Origin and 오리 (the Korean word for duck) and jean, folded into a single word. The pronunciation is short, and the meaning survives in both Korean and English. More importantly, the mascot followed in one motion — a duck plush made of denim, white topstitching along the seams, with one small dusty rose pink thread accent on a single seam. I liked the self-referential shape of it: a cloisonné enamel pin imitating the texture of denim stitching.\n\nThe handle `@orijean` was already taken, so I had to settle for `@ori-jean`. There was a small bitterness to that, but I decided that keeping the channel name itself as Orijean would be enough. The rest was straightforward. CLAUDE.md, README.md, ROADMAP.md, two scripts, the style guide, the EpisodeStamp component. About an hour of searching and replacing. I also erased every trace of the old gear-wheel logo. The denim duck takes that seat now.\n\nI removed the \"EPISODE 01\" label from EpisodeStamp. Neither Kurzgesagt nor Veritasium prints episode numbers on screen — that's metadata work, not video work. What remains in the upper-right corner is one line: \"Orijean·\". The dot is pink. A compressed echo of the mascot's stitch accent.\n\nThe last thing I tried was generating a prototype of the mascot pin through Nano Banana, but this machine doesn't have a Gemini key registered. Traces of work from another laptop are everywhere — the gemini-tts venv exists but the key doesn't, an in-between state. As soon as the key is registered, the line picks up where it left off."])</script><script>self.__next_f.push([1,"9:[\"$\",\"section\",null,{\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/tags\",\"className\":\"mb-4 inline-block font-sans text-sm transition-colors hover:opacity-70\",\"style\":{\"color\":\"var(--color-muted)\"},\"children\":\"← 모든 태그\"}],[\"$\",\"h1\",null,{\"className\":\"mb-8 text-3xl font-semibold tracking-tight\",\"style\":{\"color\":\"var(--color-ink)\"},\"children\":[\"#\",\"orijean\"]}],[\"$\",\"div\",null,{\"className\":\"divide-y\",\"style\":{\"borderColor\":\"var(--color-muted)\"},\"children\":[[\"$\",\"$L15\",\"2026-04-27\",{\"entry\":{\"title\":\"채널의 이름을 다시 짓다\",\"date\":\"2026-04-27\",\"style\":\"murakami\",\"tags\":[\"branding\",\"remotion\",\"orijean\"],\"project\":\"it-works-why\",\"slug\":\"2026-04-27\",\"content\":{\"ko\":\"채널 이름을 바꿨다. \\\"It Works, Why\\\"는 영어로는 그럭저럭 굴러갔지만, 한국어로 부르려고 하면 매번 입에 걸렸다. 그래서 며칠 머릿속에 굴리던 후보 중 하나를 골랐다. Orijean. 오리진(origin)과 오리, 그리고 jean을 한 단어로 접었다. 발음이 짧고, 한국어로도 영어로도 의미를 잃지 않는다. 무엇보다 마스코트가 한 번에 따라왔다. 청 데님으로 만든 오리 인형. 흰 topstitching이 박혀 있고, 한 자리에만 dusty rose 핑크 실땀이 들어가 있는 인형. 매체와 주제가 자기참조하는 형태가 마음에 들었다 — 에나멜 핀이 데님 위의 박음질을 흉내낸다는 사실이.\\n\\n핸들은 `@orijean`이 이미 선점되어 있어서 `@ori-jean`으로 했다. 약간 분한 마음이 있었지만, 채널명만 Orijean으로 살리면 된다고 결론냈다. 이후 작업은 단순했다. CLAUDE.md, README.md, ROADMAP.md, 그리고 두 개의 스크립트, 스타일 가이드, EpisodeStamp 컴포넌트까지. 검색해서 바꿔치우는 작업을 한 시간쯤 했다. 톱니바퀴 로고에 대한 모든 흔적도 지웠다. 이제 그 자리는 데님 오리가 들어선다.\\n\\nEpisodeStamp에서 \\\"EPISODE 01\\\" 표시를 떼어냈다. Kurzgesagt도, Veritasium도 화면에 에피소드 번호를 박지 않는다. 그건 메타데이터의 일이지 영상의 일이 아니다. 우상단에 남은 건 \\\"Orijean·\\\"이라는 단 한 줄. 점은 핑크. 마스코트 한 자리의 stitch accent를 압축한 형태로.\\n\\n마지막으로 마스코트 핀 prototype을 Nano Banana로 뽑으려 했는데, 이 머신엔 Gemini 키가 등록되어 있지 않았다. 다른 맥북에서 작업하던 흔적이 곳곳에 보인다 — gemini-tts venv는 있는데 키는 없는, 어중간한 상태. 키만 등록되면 곧바로 이어진다.\",\"en\":\"$16\"}}}]]}]]}]\n"])</script></body></html>
