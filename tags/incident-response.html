",\"content\":\"매일의 개발 세션을 기록하는 개발 일지. A developer journal written in calm, reflective prose.\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:site_name\",\"content\":\"로그의 숲 — Forest of Logs\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale\",\"content\":\"ko_KR\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"#incident-response | 로그의 숲\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"매일의 개발 세션을 기록하는 개발 일지. A developer journal written in calm, reflective prose.\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[10708,[\"/_next/static/chunks/069nmw_7.sgof.js\",\"/_next/static/chunks/0wo0zz4rhjzv8.js\",\"/_next/static/chunks/0gte95qux2co_.js\"],\"\"]\n15:I[73763,[\"/_next/static/chunks/069nmw_7.sgof.js\",\"/_next/static/chunks/0wo0zz4rhjzv8.js\",\"/_next/static/chunks/0gte95qux2co_.js\"],\"EntryCard\"]\n16:T408,Build on leased land and one day you get an eviction notice. That's what lottie.host did. The external service hosting our share button animation started returning 403. Over forty URLs depending on it were embedded across the codebase.\n\nSome browser caches still held the original file. I extracted the JSON from Chrome DevTools and uploaded it to our own S3. Updated the URL in the database. Simple enough.\n\nWhat followed was not. Laravel had the config values permanently cached in Redis, so the database change didn't show up on screen. I tried clearing the cache from an Elastic Beanstalk postdeploy hook, but the hook process lacked environment variables, so the Redis connection itself failed. The instances didn't even have SSM.\n\nAfter an hour wrestling with cache invalidation, I reread the code. The site_configs table has ten rows. Permanent caching was never warranted for that scale. I removed rememberForever and switched to querying the database on every request. One deploy and it was done. Should have started there.9:[\"$\",\"section\",null,{\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/tags\",\"className\":\"mb-4 inline-block font-sans text-sm transition-colors hover:opacity-70\",\"style\":{\"color\":\"var(--color-muted)\"},\"children\":\"← 모든 태그\"}],[\"$\",\"h1\",null,{\"className\":\"mb-8 text-3xl font-semibold tracking-tight\",\"style\":{\"color\":\"var(--color-ink)\"},\"children\":[\"#\",\"incident-response\"]}],[\"$\",\"div\",null,{\"className\":\"divide-y\",\"style\":{\"borderColor\":\"var(--color-muted)\"},\"children\":[[\"$\",\"$L15\",\"2026-04-11\",{\"entry\":{\"title\":\"임대한 땅 위의 건물\",\"titleEn\":\"A Building on Leased Land\",\"date\":\"2026-04-11\",\"style\":\"murakami\",\"tags\":[\"lottie\",\"caching\",\"aws\",\"incident-response\"],\"project\":\"longblack-legacy, agent-ops\",\"slug\":\"2026-04-11\",\"content\":{\"ko\":\"남의 땅 위에 건물을 올려놓으면 어느 날 철거 통보를 받는다. lottie.host가 그랬다. 공유 버튼의 애니메이션 파일을 호스팅하던 외부 서비스가 403을 돌려보내기 시작했다. 코드베이스에는 그 서비스에 의존하는 URL이 마흔 개 넘게 박혀 있었다.\\n\\n다행히 일부 기기의 브라우저 캐시에 원본이 남아 있었다. 크롬 DevTools에서 JSON을 추출하고 자체 S3에 올렸다. DB의 URL을 교체했다. 여기까지는 단순했다.\\n\\n문제는 그다음이었다. Laravel이 설정값을 Redis에 영구 캐싱하고 있어서 DB를 바꿔도 화면에 반영되지 않았다. Elastic Beanstalk의 postdeploy 훅에서 캐시를 날리려 했으나, 훅 프로세스에 환경변수가 주입되지 않아 Redis 연결 자체가 실패했다. SSM도 걸려 있지 않은 인스턴스였다.\\n\\n한 시간을 캐시 무효화와 씨름하다가 코드를 다시 읽었다. site_configs 테이블은 row가 열 개다. 영구 캐싱이 필요한 규모가 아니었다. rememberForever를 지우고 매 요청마다 DB를 조회하도록 고쳤다. 배포 한 번으로 끝났다. 처음부터 그렇게 했으면 됐을 일이다.\",\"en\":\"$16\"}}}]]}]]}]\n"])</script></body></html>
